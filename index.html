<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>참나무 고목 지도</title>
<style>
  html, body { margin:0; padding:0; height:100%; font-family:'Malgun Gothic', sans-serif; }
  #map { width:100%; height:100%; }

  #panel {
    position:absolute; top:12px; left:12px; z-index:10;
    background:#fff; padding:10px 12px; border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,0.25); width:280px;
  }
  #panel.collapsed { width:auto; padding:6px 10px; }
  #panel.collapsed #panelBody { display:none; }
  #panelToggle {
    display:block; width:100%; text-align:right; background:none;
    border:none; cursor:pointer; font-size:13px; color:#555; padding:2px 0;
  }
  #panel input {
    width:100%; box-sizing:border-box; padding:8px; font-size:14px;
    border:1px solid #ccc; border-radius:4px;
  }
  #panel button {
    width:100%; margin-top:6px; padding:8px; font-size:14px;
    border:none; border-radius:4px; background:#FEE500; cursor:pointer;
  }
  #resultList { max-height:220px; overflow-y:auto; margin-top:8px; font-size:13px; }
  #resultList div {
    padding:6px 4px; border-bottom:1px solid #eee; cursor:pointer;
  }
  #resultList div:hover { background:#f5f5f5; }

  #legend {
    position:absolute; bottom:20px; left:12px; z-index:10;
    background:#fff; padding:8px 10px; border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,0.25); font-size:12px;
  }
  #legend div.row { margin-bottom:4px; }
  #legend span.swatch { display:inline-block; width:18px; height:18px; margin-right:6px; vertical-align:middle; border:1px solid rgba(0,0,0,0.35); border-radius:2px; }
  #legendToggle {
    display:block; width:100%; text-align:right; background:none;
    border:none; cursor:pointer; font-size:12px; color:#555; padding:2px 0; margin-bottom:4px;
  }
  #legendStrip { display:none; gap:3px; }
  #legendStrip span { display:inline-block; width:14px; height:14px; border:1px solid rgba(0,0,0,0.3); border-radius:2px; }
  #legend.collapsed { padding:6px 8px; }
  #legend.collapsed #legendBody { display:none; }
  #legend.collapsed #legendToggle { margin-bottom:0; text-align:center; }
  #legend.collapsed #legendStrip { display:flex; }

  #locateBtn {
    position:fixed; bottom:20px; right:12px; z-index:20;
    width:44px; height:44px; border-radius:50%; border:none;
    background:#fff; box-shadow:0 2px 8px rgba(0,0,0,0.25);
    cursor:pointer; font-size:20px; display:flex; align-items:center; justify-content:center;
  }
  #locateBtn:active { background:#f0f0f0; }
</style>
</head>
<body>

<div id="panel">
  <button id="panelToggle" onclick="togglePanel()">▲ 접기</button>
  <div id="panelBody">
    <input type="text" id="keyword" placeholder="예: 원삼면 펜션, 두창저수지 등">
    <button onclick="searchPlaces()">검색</button>
    <div id="resultList"></div>
  </div>
</div>

<div id="legend">
  <button id="legendToggle" onclick="toggleLegend()">▼ 접기</button>
  <div id="legendBody">
    <div class="row"><span class="swatch" style="background:#2c0a43;"></span>9영급</div>
    <div class="row"><span class="swatch" style="background:#4b1575;"></span>8영급</div>
    <div class="row"><span class="swatch" style="background:#6823a4;"></span>7영급</div>
    <div class="row"><span class="swatch" style="background:#8237cd;"></span>6영급</div>
    <div class="row"><span class="swatch" style="background:#a071d6;"></span>5영급</div>
    <div class="row"><span class="swatch" style="background:#cfc2e0;"></span>4영급</div>
    <div class="row"><span class="swatch" style="background:#dcd4e7;"></span>3영급</div>
    <div class="row"><span class="swatch" style="background:#e7e2ee;"></span>2영급</div>
    <div class="row"><span class="swatch" style="background:#f2eff5;"></span>1영급</div>
  </div>
  <div id="legendStrip">
    <span style="background:#2c0a43;" title="9영급"></span>
    <span style="background:#4b1575;" title="8영급"></span>
    <span style="background:#6823a4;" title="7영급"></span>
    <span style="background:#8237cd;" title="6영급"></span>
    <span style="background:#a071d6;" title="5영급"></span>
    <span style="background:#cfc2e0;" title="4영급"></span>
    <span style="background:#dcd4e7;" title="3영급"></span>
    <span style="background:#e7e2ee;" title="2영급"></span>
    <span style="background:#f2eff5;" title="1영급"></span>
  </div>
</div>

<div id="map"></div>
<button id="locateBtn" title="내 위치 찾기">📍</button>

<!--
  ⚠️ 아래 appkey= 뒤에 카카오 개발자센터에서 발급받은
  "JavaScript 키"를 넣어주세요. (REST API 키 아님, JavaScript 키!)

  발급 방법:
  1) https://developers.kakao.com 접속 → 로그인 → [내 애플리케이션] → 애플리케이션 추가
  2) 앱 만든 후 [앱 키] 탭에서 "JavaScript 키" 복사
  3) [플랫폼] 탭 → Web 플랫폼 등록 → 이 파일을 실행할 주소를 등록
     (예: 로컬에서 테스트하면 http://localhost:5500 같은 주소, 실제 배포하면 그 도메인)
     * 도메인 등록을 안 하면 지도가 아예 안 뜹니다. 꼭 해주세요.
-->
<script type="text/javascript"
  src="//dapi.kakao.com/v2/maps/sdk.js?appkey=b6be609f48c0c84193b5809a6b4fe72e&libraries=services"></script>

<script>
  function togglePanel() {
    var panel = document.getElementById('panel');
    var btn = document.getElementById('panelToggle');
    panel.classList.toggle('collapsed');
    btn.textContent = panel.classList.contains('collapsed') ? '▼ 검색' : '▲ 접기';
  }

  function toggleLegend() {
    var legend = document.getElementById('legend');
    var btn = document.getElementById('legendToggle');
    legend.classList.toggle('collapsed');
    btn.textContent = legend.classList.contains('collapsed') ? '▲ 범례' : '▼ 접기';
  }

  var mapContainer = document.getElementById('map');
  var mapOption = {
    center: new kakao.maps.LatLng(37.130, 127.330),
    level: 6
  };
  var map = new kakao.maps.Map(mapContainer, mapOption);
  var ps = new kakao.maps.services.Places();
  var geocoder = new kakao.maps.services.Geocoder();
  var searchMarkers = [];
  var infowindow = new kakao.maps.InfoWindow({ zIndex: 2 });

  function searchPlaces() {
    var keyword = document.getElementById('keyword').value.trim();
    if (!keyword) { alert('검색어를 입력해주세요.'); return; }

    var combined = [];
    var doneCount = 0;
    var TOTAL_CALLS = 2;

    function onOneDone() {
      doneCount++;
      if (doneCount >= TOTAL_CALLS) renderCombinedResults(combined);
    }

    // 1) 상호명/장소명 검색 (예: 지성고깃집, 원삼면 펜션)
    ps.keywordSearch(keyword, function(data, status) {
      if (status === kakao.maps.services.Status.OK) {
        data.forEach(function(place) {
          combined.push({
            title: place.place_name,
            subtitle: place.address_name,
            x: place.x,
            y: place.y
          });
        });
      }
      onOneDone();
    });

    // 2) 주소 검색 (예: 경기 용인시 처인구 ○○로 123)
    geocoder.addressSearch(keyword, function(data, status) {
      if (status === kakao.maps.services.Status.OK) {
        data.forEach(function(addr) {
          var roadAddr = addr.road_address ? addr.road_address.address_name : null;
          combined.push({
            title: roadAddr || addr.address_name,
            subtitle: roadAddr ? addr.address_name : '지번 주소',
            x: addr.x,
            y: addr.y
          });
        });
      }
      onOneDone();
    });
  }
  document.getElementById('keyword').addEventListener('keydown', function(e){
    if (e.key === 'Enter') searchPlaces();
  });

  function renderCombinedResults(results) {
    searchMarkers.forEach(m => m.setMap(null));
    searchMarkers = [];
    var listEl = document.getElementById('resultList');
    listEl.innerHTML = '';

    if (results.length === 0) {
      listEl.innerHTML = '<div>검색 결과가 없습니다.</div>';
      return;
    }

    var bounds = new kakao.maps.LatLngBounds();
    results.forEach(function(item) {
      var pos = new kakao.maps.LatLng(item.y, item.x);
      var marker = new kakao.maps.Marker({ map: map, position: pos });
      searchMarkers.push(marker);
      bounds.extend(pos);

      kakao.maps.event.addListener(marker, 'click', function() {
        suppressNextMapClick = true;
        infowindow.setContent('<div style="padding:5px;font-size:13px;">' + item.title + '</div>');
        infowindow.open(map, marker);
        map.setCenter(pos);
      });

      var row = document.createElement('div');
      row.textContent = item.title + ' (' + item.subtitle + ')';
      row.onclick = function() {
        map.setCenter(pos);
        map.setLevel(4);
        infowindow.setContent('<div style="padding:5px;font-size:13px;">' + item.title + '</div>');
        infowindow.open(map, marker);
      };
      listEl.appendChild(row);
    });

    map.setBounds(bounds);
  }

  // 지도 빈 곳 클릭 시 검색 마커와 말풍선 초기화
  var suppressNextMapClick = false;
  kakao.maps.event.addListener(map, 'click', function() {
    if (suppressNextMapClick) { suppressNextMapClick = false; return; }
    infowindow.close();
    searchMarkers.forEach(m => m.setMap(null));
    searchMarkers = [];
  });

  var allFeatures = [];
  var currentPolygons = [];
  var ZOOM_LEVEL_THRESHOLD = 8;
  var MAX_POLYGONS_ON_SCREEN = 4000;

  var GRADE_COLORS = {
    '9': '#2c0a43',
    '8': '#4b1575',
    '7': '#6823a4',
    '6': '#8237cd',
    '5': '#a071d6',
    '4': '#cfc2e0',
    '3': '#dcd4e7',
    '2': '#e7e2ee',
    '1': '#f2eff5'
  };

  function colorByGrade(props) {
    var grade = String(props.AGCLS_NM || props.AGCLS_CD || '');
    for (var g = 9; g >= 1; g--) {
      if (grade.includes(String(g))) return GRADE_COLORS[String(g)];
    }
    return '#f2eff5';
  }

  function getBbox(coordsList) {
    var minLng = Infinity, minLat = Infinity, maxLng = -Infinity, maxLat = -Infinity;
    coordsList.forEach(function(polyCoords) {
      if (!polyCoords || !polyCoords[0]) return;
      polyCoords[0].forEach(function(c) {
        if (!c || c.length < 2) return;
        if (c[0] < minLng) minLng = c[0];
        if (c[0] > maxLng) maxLng = c[0];
        if (c[1] < minLat) minLat = c[1];
        if (c[1] > maxLat) maxLat = c[1];
      });
    });
    return { minLng: minLng, minLat: minLat, maxLng: maxLng, maxLat: maxLat };
  }

  function bboxIntersectsBounds(bbox, bounds) {
    var sw = bounds.getSouthWest(), ne = bounds.getNorthEast();
    return !(bbox.maxLng < sw.getLng() || bbox.minLng > ne.getLng() ||
              bbox.maxLat < sw.getLat() || bbox.minLat > ne.getLat());
  }

  function clearCurrentPolygons() {
    currentPolygons.forEach(function(p) { p.setMap(null); });
    currentPolygons = [];
  }

  function renderVisiblePolygons() {
    clearCurrentPolygons();

    if (map.getLevel() > ZOOM_LEVEL_THRESHOLD) return;
    if (allFeatures.length === 0) return;

    var bounds = map.getBounds();
    var drawn = 0;
    var groups = {}; // "수종||영급" -> { paths: [LatLng배열, ...], properties }

    for (var i = 0; i < allFeatures.length; i++) {
      if (drawn >= MAX_POLYGONS_ON_SCREEN) break;
      let f = allFeatures[i];
      if (!bboxIntersectsBounds(f.bbox, bounds)) continue;

      var key = (f.properties.KOFTR_NM || '') + '||' + (f.properties.AGCLS_NM || f.properties.AGCLS_CD || '');
      if (!groups[key]) {
        groups[key] = { paths: [], properties: f.properties };
      }

      f.coordsList.forEach(function(polyCoords) {
        if (!polyCoords || !polyCoords[0] || polyCoords[0].length < 3) return;
        var path = polyCoords[0].map(c => new kakao.maps.LatLng(c[1], c[0]));
        groups[key].paths.push(path);
      });
      drawn++;
    }

    Object.keys(groups).forEach(function(key) {
      var g = groups[key];
      var polygon = new kakao.maps.Polygon({
        map: map,
        path: g.paths,
        strokeWeight: 1,
        strokeColor: '#4b1575',
        strokeOpacity: 0.8,
        fillColor: colorByGrade(g.properties),
        fillOpacity: 0.55
      });
      currentPolygons.push(polygon);

      kakao.maps.event.addListener(polygon, 'click', function(mouseEvent) {
        suppressNextMapClick = true;
        var p = g.properties;
        infowindow.setContent(
          '<div style="padding:6px;font-size:12px;">' +
          (p.KOFTR_NM || '수종 정보 없음') + ' / ' + (p.AGCLS_NM || p.AGCLS_CD || '') +
          '</div>'
        );
        infowindow.setPosition(mouseEvent.latLng);
        infowindow.open(map);
      });
    });
  }

  var myLocationMarker = null;

  function locateMe() {
    if (!navigator.geolocation) {
      alert('이 브라우저에서는 위치 찾기를 지원하지 않습니다.');
      return;
    }
    var btn = document.getElementById('locateBtn');
    btn.textContent = '⏳';

    navigator.geolocation.getCurrentPosition(
      function(pos) {
        btn.textContent = '📍';
        var here = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
        map.setCenter(here);
        map.setLevel(4);

        if (myLocationMarker) myLocationMarker.setMap(null);
        myLocationMarker = new kakao.maps.Marker({
          map: map,
          position: here,
          image: new kakao.maps.MarkerImage(
            'data:image/svg+xml;utf-8,' + encodeURIComponent(
              '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"><circle cx="12" cy="12" r="8" fill="%234285F4" stroke="white" stroke-width="3"/></svg>'
            ),
            new kakao.maps.Size(24, 24)
          )
        });
      },
      function(err) {
        btn.textContent = '📍';
        alert('위치를 가져올 수 없습니다. 브라우저의 위치 권한을 허용해주세요.');
      },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  }
  document.getElementById('locateBtn').addEventListener('click', locateMe);

  function transformFeatures(features) {
    var out = [];
    var skipped = 0;
    features.forEach(function(feature) {
      try {
        if (!feature.geometry || !feature.geometry.coordinates ||
            feature.geometry.coordinates.length === 0) {
          skipped++; return;
        }
        var coordsList = feature.geometry.type === 'Polygon'
          ? [feature.geometry.coordinates]
          : feature.geometry.coordinates;

        var valid = coordsList.every(function(polyCoords) {
          return polyCoords && polyCoords[0] && polyCoords[0].length >= 4;
        });
        if (!valid) { skipped++; return; }

        out.push({
          coordsList: coordsList,
          bbox: getBbox(coordsList),
          properties: feature.properties
        });
      } catch (e) {
        skipped++;
      }
    });
    if (skipped > 0) console.log('스킵된(깨진) 폴리곤:', skipped);
    return out;
  }

  var tileManifest = null;   // { tileSize, tiles: { "tx_ty": {bounds, count} } }
  var loadedTileIds = {};    // tileId -> true (이미 불러온 타일)
  var pendingTileIds = {};   // tileId -> true (지금 불러오는 중인 타일, 중복 요청 방지)

  function getTileIdsForBounds(bounds, tileSize) {
    var sw = bounds.getSouthWest(), ne = bounds.getNorthEast();
    var txMin = Math.floor(sw.getLng() / tileSize);
    var txMax = Math.floor(ne.getLng() / tileSize);
    var tyMin = Math.floor(sw.getLat() / tileSize);
    var tyMax = Math.floor(ne.getLat() / tileSize);
    var ids = [];
    for (var tx = txMin; tx <= txMax; tx++) {
      for (var ty = tyMin; ty <= tyMax; ty++) {
        ids.push(tx + '_' + ty);
      }
    }
    return ids;
  }

  function fetchTile(tileId) {
    pendingTileIds[tileId] = true;
    return fetch('tiles/tile_' + tileId + '.geojson.gz')
      .then(function(res) {
        if (!res.ok) throw new Error('타일 없음: ' + tileId);
        return res.arrayBuffer();
      })
      .then(function(buffer) {
        var ds = new DecompressionStream('gzip');
        var stream = new Blob([buffer]).stream().pipeThrough(ds);
        return new Response(stream).json();
      })
      .then(function(geojson) {
        var transformed = transformFeatures(geojson.features);
        allFeatures = allFeatures.concat(transformed);
        loadedTileIds[tileId] = true;
      })
      .catch(function(err) {
        // 해당 격자에 데이터가 아예 없는 지역(바다, 도심 등)일 수 있음 — 정상
        loadedTileIds[tileId] = true; // 재요청 방지
      })
      .finally(function() {
        delete pendingTileIds[tileId];
      });
  }

  function onMapIdle() {
    if (!tileManifest) return;

    if (map.getLevel() > ZOOM_LEVEL_THRESHOLD) {
      clearCurrentPolygons();
      return;
    }

    var bounds = map.getBounds();
    var neededIds = getTileIdsForBounds(bounds, tileManifest.tileSize);
    var toFetch = neededIds.filter(function(id) {
      return tileManifest.tiles[id] && !loadedTileIds[id] && !pendingTileIds[id];
    });

    // 이미 불러온 타일 기준으로 우선 한번 그려서 즉시 반응하게 함
    renderVisiblePolygons();

    if (toFetch.length > 0) {
      Promise.all(toFetch.map(fetchTile)).then(function() {
        renderVisiblePolygons();
      });
    }
  }

  function loadForestData() {
    fetch('tiles/manifest.json')
      .then(function(res) {
        if (!res.ok) throw new Error('manifest.json 없음');
        return res.json();
      })
      .then(function(manifest) {
        tileManifest = manifest;
        kakao.maps.event.addListener(map, 'idle', onMapIdle);
        onMapIdle();
      })
      .catch(function(err) {
        console.log('tiles/manifest.json을 아직 못 찾았습니다. (정상 — 파일 넣기 전까지는 지도+검색만 동작합니다)', err);
      });
  }

  loadForestData();

  // 페이지 최초 로드 시 내 위치로 자동 이동 시도 (실패해도 조용히 기본 위치 유지)
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      function(pos) {
        var here = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
        map.setCenter(here);
        map.setLevel(4);

        if (myLocationMarker) myLocationMarker.setMap(null);
        myLocationMarker = new kakao.maps.Marker({
          map: map,
          position: here,
          image: new kakao.maps.MarkerImage(
            'data:image/svg+xml;utf-8,' + encodeURIComponent(
              '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"><circle cx="12" cy="12" r="8" fill="%234285F4" stroke="white" stroke-width="3"/></svg>'
            ),
            new kakao.maps.Size(24, 24)
          )
        });
      },
      function(err) {
        // 위치 권한 거부 또는 실패 시 아무 알림 없이 기본 중심 위치 유지
      },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  }
</script>

</body>
</html>
