<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>참나무 고목 지도</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin:0; padding:0; height:100%; height:calc(var(--vh, 1vh) * 100); font-family:'Malgun Gothic', sans-serif; overflow:hidden; }
  #map { width:100%; height:100%; }

  #splashScreen {
    position:fixed; top:0; left:0; width:100%; height:100%;
    z-index:100; background: radial-gradient(circle at 50% 40%, #3a1160 0%, #1a0630 75%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition: opacity 0.6s ease;
  }
  #splashLogo {
    width:220px; height:220px; border-radius:50%; object-fit:cover;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    animation: splashFloat 2.6s ease-in-out infinite;
  }
  @keyframes splashFloat {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-14px); }
  }
  #splashSubtitle {
    margin-top:22px; color:#cbb8e8; font-size:13px;
  }
  #splashDots { margin-top:22px; display:flex; gap:8px; }
  #splashDots span {
    width:8px; height:8px; border-radius:50%; background:#a071d6;
    animation: splashBlink 1.4s infinite ease-in-out both;
  }
  #splashDots span:nth-child(1) { animation-delay:-0.32s; }
  #splashDots span:nth-child(2) { animation-delay:-0.16s; }
  @keyframes splashBlink {
    0%, 80%, 100% { opacity:0.25; transform:scale(0.8); }
    40% { opacity:1; transform:scale(1); }
  }

  #panel {
    position:absolute; top:12px; left:12px; z-index:10;
    background:#fff; padding:8px 10px; border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,0.25); width:220px;
  }
  #panel.collapsed { width:auto; padding:6px 10px; }
  #panel.collapsed #panelBody { display:none; }
  #panelToggle {
    display:block; width:100%; text-align:right; background:none;
    border:none; cursor:pointer; font-size:12px; color:#555; padding:2px 0;
  }
  #panel input {
    width:100%; box-sizing:border-box; padding:6px; font-size:13px;
    border:1px solid #ccc; border-radius:4px;
  }
  #panel button {
    width:100%; margin-top:5px; padding:6px; font-size:13px;
    border:none; border-radius:4px; background:#FEE500; cursor:pointer;
  }
  #resultList { max-height:200px; overflow-y:auto; margin-top:6px; font-size:12px; }
  #resultList div {
    padding:5px 4px; border-bottom:1px solid #eee; cursor:pointer;
  }
  #resultList div:hover { background:#f5f5f5; }

  #recentSearchList {
    margin-top:4px; border:1px solid #eee; border-radius:4px;
    max-height:160px; overflow-y:auto;
  }
  #recentSearchList .recentHeader {
    font-size:10px; color:#888; padding:4px 8px 2px;
  }
  #recentSearchList .recentItem {
    padding:5px 8px; font-size:12px; cursor:pointer; border-bottom:1px solid #f2f2f2;
  }
  #recentSearchList .recentItem:hover { background:#f5f5f5; }
  #recentSearchList .recentDelete {
    float:right; color:#aaa; padding:0 4px;
  }

  #locateBtn {
    position:fixed; bottom:20px; right:12px; z-index:20;
    width:44px; height:44px; border-radius:50%; border:none;
    background:#fff; box-shadow:0 2px 8px rgba(0,0,0,0.25);
    cursor:pointer; font-size:20px; display:flex; align-items:center; justify-content:center;
  }
  #locateBtn:active { background:#f0f0f0; }
  #roadviewBtn {
    position:fixed; bottom:72px; right:12px; z-index:20;
    width:44px; height:44px; border-radius:50%; border:none;
    background:#fff; box-shadow:0 2px 8px rgba(0,0,0,0.25);
    cursor:pointer; font-size:20px; display:flex; align-items:center; justify-content:center;
  }
  #roadviewBtn.active { background:#7a3ea1; }
  #roadviewBtn:active { background:#f0f0f0; }
  #satelliteBtn {
    position:fixed; bottom:124px; right:12px; z-index:20;
    width:44px; height:44px; border-radius:50%; border:none;
    background:#fff; box-shadow:0 2px 8px rgba(0,0,0,0.25);
    cursor:pointer; font-size:20px; display:flex; align-items:center; justify-content:center;
  }
  #satelliteBtn.active { background:#7a3ea1; }
  #satelliteBtn:active { background:#f0f0f0; }
  #toggleLayerBtn {
    position:fixed; bottom:176px; right:12px; z-index:20;
    width:44px; height:44px; border-radius:50%; border:none;
    background:#fff; box-shadow:0 2px 8px rgba(0,0,0,0.25);
    cursor:pointer; font-size:20px; display:flex; align-items:center; justify-content:center;
  }
  #toggleLayerBtn.off { background:#ddd; opacity:0.6; }
  #toggleLayerBtn:active { background:#f0f0f0; }

  #trackToggleBtn {
    position:fixed; top:12px; right:12px; z-index:20;
    width:44px; height:44px; border-radius:50%; border:none;
    background:#fff; box-shadow:0 2px 8px rgba(0,0,0,0.25);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  #trackToggleBtn:active { background:#f0f0f0; }
  #trackToggleBtn.active { background:#7a3ea1; }
  #trackToggleBtn svg path { fill:#4b1575; transition: fill 0.15s ease; }
  #trackToggleBtn.active svg path { fill:#fff; }

  #savedListBtn {
    position:fixed; bottom:70px; left:12px; z-index:20;
    width:44px; height:44px; border-radius:50%; border:none;
    background:#fff; box-shadow:0 2px 8px rgba(0,0,0,0.25);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  #savedListBtn:active { background:#f0f0f0; }

  #weatherBadge {
    position:fixed; bottom:20px; left:12px; z-index:15;
    background:#fff; padding:6px 10px; border-radius:16px;
    box-shadow:0 2px 6px rgba(0,0,0,0.25); font-size:12px; color:#333;
    white-space:nowrap; display:flex; align-items:center; gap:8px;
  }
  #weatherBadge a {
    color:#4b1575; text-decoration:none; font-weight:bold; font-size:14px;
    margin-left:2px;
  }

  #savedListOverlay {
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.4); z-index:60;
    display:none; align-items:flex-end; justify-content:center;
  }
  #savedListOverlay.show { display:flex; }
  #savedListPanel {
    background:#fff; width:100%; max-width:420px; max-height:60vh;
    border-radius:16px 16px 0 0; padding:14px; box-sizing:border-box;
    overflow-y:auto;
  }
  #savedListPanel h3 { margin:0 0 10px; font-size:15px; display:inline-block; }
  #savedListCloseBtn {
    float:right; background:none; border:none; font-size:18px;
    cursor:pointer; color:#888;
  }
  .savedListItem {
    padding:8px 6px; border-bottom:1px solid #eee; cursor:pointer; font-size:14px;
  }
  .savedListItem:last-child { border-bottom:none; }
  .savedListItemName { font-weight:bold; display:flex; align-items:center; gap:6px; }
  .savedListItemName img { width:16px; height:16px; flex-shrink:0; }
  .savedListItemAddr { font-size:12px; color:#888; margin-top:2px; margin-left:22px; }
  .savedListEmpty { padding:20px 0; text-align:center; color:#999; font-size:13px; }

  #placeModalOverlay {
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.4); z-index:65;
    display:none; align-items:flex-end; justify-content:center;
  }
  #placeModalOverlay.show { display:flex; }
  #placeModalPanel {
    background:#fff; width:100%; max-width:420px;
    border-radius:16px 16px 0 0; padding:16px; box-sizing:border-box;
    max-height:80vh; overflow-y:auto;
  }
  #placeModalPanel h3 { margin:0 0 10px; font-size:15px; display:inline-block; }
  #placeModalCloseBtn {
    float:right; background:none; border:none; font-size:18px;
    cursor:pointer; color:#888;
  }
  #placeModalName, #placeModalDate, #placeModalMemo {
    width:100%; box-sizing:border-box; padding:8px; font-size:14px;
    border:1px solid #ccc; border-radius:6px; margin-top:8px; font-family:inherit;
  }
  #placeModalMemo { min-height:60px; resize:vertical; }
  #placeModalIconRow { display:flex; gap:12px; margin-top:10px; }
  .placeIconChoice {
    flex:1; padding:10px; border:2px solid #eee; border-radius:10px;
    background:#fafafa; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .placeIconChoice.selected { border-color:#4b1575; background:#f2eaff; }
  .placeIconChoice svg { display:block; }
  #placeModalSaveBtn {
    width:100%; margin-top:12px; padding:10px; font-size:14px;
    border:none; border-radius:6px; background:#4b1575; color:#fff; cursor:pointer;
  }
  #placeModalDeleteBtn {
    width:100%; margin-top:8px; padding:10px; font-size:14px;
    border:1px solid #c0392b; border-radius:6px; background:#fff; color:#c0392b; cursor:pointer;
  }
  .placeModalLabel { font-size:12px; color:#888; margin-top:10px; display:block; }

  #roadviewPanel {
    position:fixed; top:0; left:0; width:100%; height:100%;
    z-index:50; display:none; background:#000;
  }
  #roadviewPanel.active { display:block; }
  #roadviewContainer { width:100%; height:100%; }
  #roadviewMinimap {
    position:absolute; right:12px; bottom:12px; z-index:5;
    width:120px; height:120px; border-radius:8px; overflow:hidden;
    border:2px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,0.5);
  }
  #roadviewHeadingArrow {
    position:absolute; top:50%; left:50%; z-index:5; pointer-events:none;
    transform:translate(-50%,-50%) rotate(0deg);
    width:26px; height:26px;
  }
  #roadviewCloseBtn {
    position:absolute; top:12px; right:12px; z-index:51;
    width:40px; height:40px; border-radius:50%; border:none;
    background:#fff; box-shadow:0 2px 8px rgba(0,0,0,0.4);
    cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center;
  }

  #watermark {
    position:fixed; bottom:4px; right:70px; z-index:15;
    font-size:9px; color:#666; background:rgba(255,255,255,0.65);
    padding:1px 5px; border-radius:3px; pointer-events:none;
    white-space:nowrap;
  }
</style>

</head>
<body>

<div id="splashScreen">
  <img id="splashLogo" src="beetle-logo.png" alt="고도뤼의 참나무 고목지도">
  <div id="splashSubtitle">사슴벌레 서식지를 찾는 중...</div>
  <div id="splashDots"><span></span><span></span><span></span></div>
</div>

<div id="panel" class="collapsed">
  <button id="panelToggle" onclick="togglePanel()">▼ 검색</button>
  <div id="panelBody">
    <input type="text" id="keyword" placeholder="예: 원삼면 펜션, 두창저수지 등">
    <div id="recentSearchList" style="display:none;"></div>
    <button onclick="searchPlaces()">검색</button>
    <div id="resultList"></div>
  </div>
</div>

<button id="trackToggleBtn" title="내 위치 실시간 추적">
  <svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 2 L19 21 L12 17 L5 21 Z"/></svg>
</button>

<button id="savedListBtn" title="저장한 장소 목록">
  <svg width="22" height="22" viewBox="0 0 24 24">
    <defs>
      <radialGradient id="pinGrad" cx="35%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#a78bfa"/>
        <stop offset="60%" stop-color="#6d28d9"/>
        <stop offset="100%" stop-color="#4b1575"/>
      </radialGradient>
    </defs>
    <path d="M12 2 C7 2 4 5.5 4 10 C4 15 12 22 12 22 C12 22 20 15 20 10 C20 5.5 17 2 12 2 Z" fill="url(#pinGrad)" stroke="#3a1160" stroke-width="1"/>
    <circle cx="12" cy="10" r="4" fill="#fff"/>
  </svg>
</button>
<div id="weatherBadge"></div>
<div id="savedListOverlay">
  <div id="savedListPanel">
    <button id="savedListCloseBtn">✕</button>
    <h3>저장한 장소</h3>
    <div id="savedListItems"></div>
  </div>
</div>

<div id="placeModalOverlay">
  <div id="placeModalPanel">
    <button id="placeModalCloseBtn">✕</button>
    <h3 id="placeModalTitle">장소 저장</h3>
    <input type="text" id="placeModalName" placeholder="장소 이름">
    <div id="placeModalIconRow">
      <button type="button" class="placeIconChoice" data-icon="star">
        <svg width="30" height="32" viewBox="0 0 30 32">
          <defs>
            <radialGradient id="starGradPreview" cx="35%" cy="30%" r="75%">
              <stop offset="0%" stop-color="#ff8a75"/>
              <stop offset="60%" stop-color="#e53935"/>
              <stop offset="100%" stop-color="#a31515"/>
            </radialGradient>
          </defs>
          <path d="M15 2 L18.5 11 L28 11.5 L20.5 17.5 L23 27 L15 21.5 L7 27 L9.5 17.5 L2 11.5 L11.5 11 Z" fill="url(#starGradPreview)" stroke="#7a1a1a" stroke-width="1" stroke-linejoin="round"/>
        </svg>
      </button>
      <button type="button" class="placeIconChoice" data-icon="circle">
        <svg width="26" height="26" viewBox="0 0 26 26">
          <defs>
            <radialGradient id="circGradPreview" cx="35%" cy="30%" r="75%">
              <stop offset="0%" stop-color="#fff59d"/>
              <stop offset="60%" stop-color="#fbc02d"/>
              <stop offset="100%" stop-color="#e65100"/>
            </radialGradient>
          </defs>
          <circle cx="13" cy="13" r="10" fill="url(#circGradPreview)" stroke="#a15c00" stroke-width="1.5"/>
        </svg>
      </button>
    </div>
    <label class="placeModalLabel">방문일</label>
    <input type="date" id="placeModalDate">
    <label class="placeModalLabel">메모 (선택)</label>
    <textarea id="placeModalMemo" placeholder="상황을 자유롭게 적어두세요"></textarea>
    <button id="placeModalSaveBtn">저장</button>
    <button id="placeModalDeleteBtn" style="display:none;">삭제</button>
  </div>
</div>

<div id="map"></div>
<div id="watermark">ⓒ 고도뤼의 참나무 고목지도</div>
<button id="locateBtn" title="내 위치 찾기">📍</button>
<button id="roadviewBtn" title="로드뷰 모드">🚶</button>
<button id="satelliteBtn" title="위성지도 전환">🛰️</button>
<button id="toggleLayerBtn" title="참나무 폴리곤 표시/숨김">🌳</button>

<div id="roadviewPanel">
  <button id="roadviewCloseBtn">✕</button>
  <div id="roadviewContainer"></div>
  <div id="roadviewMinimap">
    <div id="roadviewHeadingArrow"><svg width="30" height="30" viewBox="-15 -15 30 30"><path d="M0,-13 L7,10 L0,4 L-7,10 Z" fill="#e53935" stroke="#fff" stroke-width="1.5"/></svg></div>
  </div>
</div>

<script type="text/javascript"
  src="//dapi.kakao.com/v2/maps/sdk.js?appkey=b6be609f48c0c84193b5809a6b4fe72e&libraries=services"></script>

<script>
  function hideSplash() {
    var el = document.getElementById('splashScreen');
    if (!el) return;
    el.style.opacity = '0';
    setTimeout(function() { el.style.display = 'none'; }, 600);
  }

  function setRealViewportHeight() {
    var vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight) * 0.01;
    document.documentElement.style.setProperty('--vh', vh + 'px');
    if (typeof map !== 'undefined' && map) {
      var center = map.getCenter();
      map.relayout();
      map.setCenter(center);
    }
  }
  setRealViewportHeight();
  window.addEventListener('resize', setRealViewportHeight);
  window.addEventListener('orientationchange', setRealViewportHeight);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', setRealViewportHeight);
  }

  function togglePanel() {
    var panel = document.getElementById('panel');
    var btn = document.getElementById('panelToggle');
    panel.classList.toggle('collapsed');
    btn.textContent = panel.classList.contains('collapsed') ? '▼ 검색' : '▲ 접기';
  }

  function collapsePanel() {
    var panel = document.getElementById('panel');
    var btn = document.getElementById('panelToggle');
    panel.classList.add('collapsed');
    btn.textContent = '▼ 검색';
    document.getElementById('keyword').value = '';
    document.getElementById('resultList').innerHTML = '';
  }

  function escapeHtml(str) {
    return String(str).replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  var mapContainer = document.getElementById('map');
  var savedView = null;
  try {
    var savedViewRaw = sessionStorage.getItem('lastMapView');
    if (savedViewRaw) savedView = JSON.parse(savedViewRaw);
  } catch (e) {}

  var mapOption = savedView
    ? { center: new kakao.maps.LatLng(savedView.lat, savedView.lng), level: savedView.level }
    : { center: new kakao.maps.LatLng(37.130, 127.330), level: 6 };
  var map = new kakao.maps.Map(mapContainer, mapOption);

  if (savedView) {
    hideSplash();
    loadWeatherBadge(savedView.lat, savedView.lng);
  }

  kakao.maps.event.addListener(map, 'idle', function() {
    try {
      var center = map.getCenter();
      sessionStorage.setItem('lastMapView', JSON.stringify({
        lat: center.getLat(),
        lng: center.getLng(),
        level: map.getLevel()
      }));
    } catch (e) {}
  });

  var ps = new kakao.maps.services.Places();
  var geocoder = new kakao.maps.services.Geocoder();
  var searchMarkers = [];

  // ===== 정보창(말풍선) — 카카오 기본 InfoWindow 대신 커스텀 오버레이로 직접 구현 =====
  var infowindow = {
    overlay: null,
    _ensure: function() {
      if (!this.overlay) {
        this.overlay = new kakao.maps.CustomOverlay({ content: '', yAnchor: 1, zIndex: 3, clickable: true });
      }
    },
    setContent: function(html) {
      this._ensure();
      this.overlay.setContent(html);
    },
    setPosition: function(pos) {
      this._ensure();
      this.overlay.setPosition(pos);
    },
    open: function(map, marker) {
      this._ensure();
      if (marker) this.overlay.setPosition(marker.getPosition());
      this.overlay.setMap(map);
    },
    close: function() {
      if (this.overlay) this.overlay.setMap(null);
    }
  };
  // ===== 정보창 끝 =====

  function getShortAddress(lat, lng, callback) {
    geocoder.coord2Address(lng, lat, function(result, status) {
      if (status !== kakao.maps.services.Status.OK || !result || !result[0]) {
        callback(null);
        return;
      }
      var r = result[0];
      if (r.road_address && r.road_address.road_name) {
        var ra = r.road_address;
        var no = ra.main_building_no || '';
        if (ra.sub_building_no && ra.sub_building_no !== '0') {
          no += '-' + ra.sub_building_no;
        }
        callback((ra.road_name + ' ' + no).trim());
        return;
      }
      if (r.address) {
        var a = r.address;
        var dong = a.region_3depth_name || '';
        var jibun = (a.mountain_yn === 'Y' ? '산' : '') + (a.main_address_no || '');
        if (a.sub_address_no && a.sub_address_no !== '0') {
          jibun += '-' + a.sub_address_no;
        }
        callback((dong + ' ' + jibun).trim());
        return;
      }
      callback(null);
    });
  }

  // ===== 저장 장소 목록 패널 =====
  function openSavedList() {
    var itemsEl = document.getElementById('savedListItems');
    itemsEl.innerHTML = '';
    if (savedPlaces.length === 0) {
      itemsEl.innerHTML = '<div class="savedListEmpty">저장된 장소가 없습니다.</div>';
      document.getElementById('savedListOverlay').classList.add('show');
      return;
    }
    savedPlaces.forEach(function(place) {
      var row = document.createElement('div');
      row.className = 'savedListItem';

      var nameDiv = document.createElement('div');
      nameDiv.className = 'savedListItemName';
      var iconImg = document.createElement('img');
      iconImg.src = 'data:image/svg+xml;utf-8,' + encodeURIComponent(
        place.icon === 'circle' ? CIRCLE_MARKER_SVG : STAR_MARKER_SVG
      );
      var nameText = document.createElement('span');
      nameText.textContent = place.name;
      nameDiv.appendChild(iconImg);
      nameDiv.appendChild(nameText);

      var addrDiv = document.createElement('div');
      addrDiv.className = 'savedListItemAddr';
      addrDiv.textContent = '주소 조회 중...';

      row.appendChild(nameDiv);
      row.appendChild(addrDiv);
      row.onclick = function() {
        map.setCenter(new kakao.maps.LatLng(place.lat, place.lng));
        map.setLevel(4);
        closeSavedList();
      };
      itemsEl.appendChild(row);

      getShortAddress(place.lat, place.lng, function(addr) {
        addrDiv.textContent = addr || '주소 정보 없음';
      });
    });
    document.getElementById('savedListOverlay').classList.add('show');
  }

  function closeSavedList() {
    document.getElementById('savedListOverlay').classList.remove('show');
  }

  document.getElementById('savedListBtn').addEventListener('click', openSavedList);
  document.getElementById('savedListCloseBtn').addEventListener('click', closeSavedList);
  document.getElementById('savedListOverlay').addEventListener('click', function(e) {
    if (e.target.id === 'savedListOverlay') closeSavedList();
  });
  // ===== 저장 장소 목록 패널 끝 =====

  // ===== 기온/월광/날씨 배지 =====
  function getMoonIllumination(date) {
    var lp = 2551443; // 삭망월(초 단위, 약 29.53일)
    var newMoonRef = Date.UTC(2000, 0, 6, 18, 14, 0) / 1000;
    var phase = ((date.getTime() / 1000 - newMoonRef) % lp) / lp;
    if (phase < 0) phase += 1;
    var illumination = (1 - Math.cos(2 * Math.PI * phase)) / 2;
    return Math.round(illumination * 100);
  }

    if (code != null && code >= 51) return { icon: '🌧️', label: '비' };
    return { icon: '☁️', label: '흐림' };
  }

  // 방향(나침반) 화살표가 있는 사용자 위치 마커 이미지 생성
  function buildUserMarkerImage(angle) {
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30">' +
      '<g transform="rotate(' + angle + ' 15 15)">' +
      '<circle cx="15" cy="15" r="10" fill="#4285F4" stroke="white" stroke-width="3"/>' +
      '<path d="M15 5 L20 16 L15 13 L10 16 Z" fill="#fff"/>' +
      '</g></svg>';
    return new kakao.maps.MarkerImage(
      'data:image/svg+xml;utf-8,' + encodeURIComponent(svg),
      new kakao.maps.Size(30, 30),
      { offset: new kakao.maps.Point(15, 15) }
    );
  }

  function updateUserHeading(angle) {
    navHeadingAngle = angle;
    if (navUserMarker) navUserMarker.setImage(buildUserMarkerImage(angle));
  }

  function handleDeviceOrientation(e) {
    var heading;
    if (typeof e.webkitCompassHeading === 'number') {
      heading = e.webkitCompassHeading;
    } else if (e.alpha != null) {
      heading = 360 - e.alpha;
    } else {
      return;
    }
    updateUserHeading(heading);
  }

  function startHeadingTracking() {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(function(state) {
        if (state === 'granted') {
          window.addEventListener('deviceorientationabsolute', handleDeviceOrientation, true);
          window.addEventListener('deviceorientation', handleDeviceOrientation, true);
        }
      }).catch(function() {});
    } else if (window.DeviceOrientationEvent) {
      window.addEventListener('deviceorientationabsolute', handleDeviceOrientation, true);
      window.addEventListener('deviceorientation', handleDeviceOrientation, true);
    }
  }

  function stopHeadingTracking() {
    window.removeEventListener('deviceorientationabsolute', handleDeviceOrientation, true);
    window.removeEventListener('deviceorientation', handleDeviceOrientation, true);
    navHeadingAngle = 0;
  }

  function placeNavUserMarker(lat, lng) {
    var here = new kakao.maps.LatLng(lat, lng);
    if (navUserMarker) {
      navUserMarker.setPosition(here);
    } else {
      navUserMarker = new kakao.maps.Marker({
        map: map,
        position: here,
        image: buildUserMarkerImage(navHeadingAngle)
      });
    }
  }

  function animateNavMarkerTo(targetLat, targetLng, duration) {
    if (navAnimRAF) {
      cancelAnimationFrame(navAnimRAF);
      navAnimRAF = null;
    }
    var fromLat = navDisplayPos.lat;
    var fromLng = navDisplayPos.lng;
    var startTs = null;

    function step(ts) {
      if (!navTrackingActive) { navAnimRAF = null; return; }
      if (!startTs) startTs = ts;
      var t = Math.min((ts - startTs) / duration, 1);
      var curLat = fromLat + (targetLat - fromLat) * t;
      var curLng = fromLng + (targetLng - fromLng) * t;
      navDisplayPos = { lat: curLat, lng: curLng };
      placeNavUserMarker(curLat, curLng);
      map.setCenter(new kakao.maps.LatLng(curLat, curLng));
      if (t < 1) {
        navAnimRAF = requestAnimationFrame(step);
      } else {
        navAnimRAF = null;
      }
    }
    navAnimRAF = requestAnimationFrame(step);
  }

  function startNavTracking() {
    if (!navigator.geolocation) {
      alert('이 브라우저에서는 위치 추적을 지원하지 않습니다.');
      return;
    }
    searchMarkers.forEach(function(m) { m.setMap(null); });
    searchMarkers = [];
    navTrackingActive = true;
    navDisplayPos = null;
    navLastFixTime = null;
    navHeadingAngle = 0;
    document.getElementById('trackToggleBtn').classList.add('active');
    startHeadingTracking();
    navWatchId = navigator.geolocation.watchPosition(
      function(pos) {
        var newLat = pos.coords.latitude;
        var newLng = pos.coords.longitude;
        var now = Date.now();

        if (!navDisplayPos) {
          navDisplayPos = { lat: newLat, lng: newLng };
          placeNavUserMarker(newLat, newLng);
          map.setCenter(new kakao.maps.LatLng(newLat, newLng));
          loadWeatherBadge(newLat, newLng);
        } else {
          var duration = navLastFixTime ? (now - navLastFixTime) : 1000;
          duration = Math.max(500, Math.min(duration, 3000));
          animateNavMarkerTo(newLat, newLng, duration);
        }
        navLastFixTime = now;
      },
      function(err) {
        alert('위치를 가져올 수 없습니다. 위치 권한을 확인해주세요.');
        stopNavTracking();
      },
      { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 }
    );
  }

  function stopNavTracking() {
    if (navWatchId !== null) {
      navigator.geolocation.clearWatch(navWatchId);
      navWatchId = null;
    }
    if (navAnimRAF) {
      cancelAnimationFrame(navAnimRAF);
      navAnimRAF = null;
    }
    stopHeadingTracking();
    navTrackingActive = false;
    navDisplayPos = null;
    navLastFixTime = null;
    if (navUserMarker) { navUserMarker.setMap(null); navUserMarker = null; }
    document.getElementById('trackToggleBtn').classList.remove('active');
  }

    if (recentSearches.length > 8) recentSearches = recentSearches.slice(0, 8);

  // 영급 문자열("9영급" 등)에서 숫자만 추출
  function parseAgeGrade(agclsStr) {
    var m = String(agclsStr || '').match(/(\d+)/);
    return m ? parseInt(m[1], 10) : 0;
  }

  // 영급+경급 조합을 5단계 진하기 중 하나(9/7/5/3/1, 숫자가 클수록 진함)로 매핑
  function shadeKeyForGradeCombo(agclsStr, dmclsStr) {
    var age = parseAgeGrade(agclsStr);
    var isLarge = String(dmclsStr || '').indexOf('대경목') !== -1;
    if (age >= 7) {
      return isLarge ? '9' : '7';
    } else if (age >= 4) {
      return isLarge ? '5' : '3';
    } else {
      return '1';
    }
  }

  function colorByGrade(props) {
    var species = String(props.KOFTR_NM || '');
    var palette;
    if (species.includes('침활혼효림')) {
      palette = MIXED_FOREST_COLORS;
    } else if (species.includes('기타활엽수') || species.includes('오리나무')) {
      palette = OTHER_BROADLEAF_COLORS;
    } else {
      palette = GRADE_COLORS;
    }
    var shadeKey = shadeKeyForGradeCombo(props.AGCLS_NM || props.AGCLS_CD, props.DMCLS_NM);
    return palette[shadeKey];
  }

  function getBbox(coordsList) {
    var minLng = Infinity, minLat = Infinity, maxLng = -Infinity, maxLat = -Infinity;
    coordsList.forEach(function(polyCoords) {
      if (!polyCoords || !polyCoords[0]) return;
      polyCoords[0].forEach(function(c) {
        if (!c || c.length < 2) return;
        if (c[0] < minLng) minLng = c[0];
        if (c[0] > maxLng) maxLng = c[0];
        if (c[1] < minLat) minLat = c[1];
        if (c[1] > maxLat) maxLat = c[1];
      });
    });
    return { minLng: minLng, minLat: minLat, maxLng: maxLng, maxLat: maxLat };
  }

  function bboxIntersectsBounds(bbox, bounds) {
    var sw = bounds.getSouthWest(), ne = bounds.getNorthEast();
    return !(bbox.maxLng < sw.getLng() || bbox.minLng > ne.getLng() ||
              bbox.maxLat < sw.getLat() || bbox.minLat > ne.getLat());
  }

  var currentPolygons = [];

  function fetchElevation(lat, lng) {
    return fetch('https://api.open-elevation.com/api/v1/lookup?locations=' + lat + ',' + lng)
      .then(function(res) {

      .then(function(data) {

          return data.results[0].elevation;
        }
        throw new Error('open-elevation 데이터 없음');
      })
      .catch(function() {
        return fetch('https://api.opentopodata.org/v1/srtm90m?locations=' + lat + ',' + lng)
          .then(function(res) {
            if (!res.ok) throw new Error('opentopodata 실패');
            return res.json();
          })
          .then(function(data) {
            if (data && data.results && data.results[0] && data.results[0].elevation != null) {

  function buildInfoContent(p, elevText, showRetry) {
    return '<div style="background:rgba(255,255,255,0.88);padding:8px 10px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.25);font-size:12px;white-space:nowrap;">' +
      (p.KOFTR_NM || '수종 정보 없음') + ' / ' + (p.AGCLS_NM || p.AGCLS_CD || '') +
      (p.DMCLS_NM ? (' / ' + p.DMCLS_NM + '(추정)') : '') +
      (elevText ? '<br>' + elevText : '') +
      (showRetry ? ' <a href="#" id="elevRetryLink" style="color:#4b1575;text-decoration:underline;">다시 시도</a>' : '') +

  function requestElevation(p, lat, lng) {
    infowindow.setContent(buildInfoContent(p, '고도: 조회 중...', false));

      .then(function(elevation) {

  // ===== 점-다각형 판정(같은 색으로 묶은 폴리곤 클릭 시 원래 어떤 조각인지 찾기 위함) =====
  function pointInRing(lng, lat, ring) {
    var inside = false;
    for (var i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      var xi = ring[i][0], yi = ring[i][1];
      var xj = ring[j][0], yj = ring[j][1];
      var intersect = ((yi > lat) !== (yj > lat)) &&
        (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi);
      if (intersect) inside = !inside;
    }
    return inside;
  }

  function featureContainsPoint(f, lng, lat) {
    for (var p = 0; p < f.coordsList.length; p++) {
      var rings = f.coordsList[p];
      if (!rings || !rings[0]) continue;
      if (pointInRing(lng, lat, rings[0])) {
        var inHole = false;
        for (var h = 1; h < rings.length; h++) {
          if (pointInRing(lng, lat, rings[h])) { inHole = true; break; }
        }
        if (!inHole) return true;
      }
    }
    return false;
  }
  // ===== 점-다각형 판정 끝 =====

  function renderVisiblePolygons() {
    clearCurrentPolygons();
    if (!showPolygons) return;

    if (map.getLevel() > ZOOM_LEVEL_THRESHOLD) return;
    if (allFeatures.length === 0) return;

    var bounds = map.getBounds();
    var drawn = 0;
    var groups = {}; // 색상 -> { paths: [...], features: [...] }

    for (var i = 0; i < allFeatures.length; i++) {
      if (drawn >= MAX_POLYGONS_ON_SCREEN) break;
      let f = allFeatures[i];
      if (!bboxIntersectsBounds(f.bbox, bounds)) continue;

      var color = colorByGrade(f.properties);
      if (!groups[color]) groups[color] = { paths: [], features: [] };

      f.coordsList.forEach(function(polyCoords) {
        if (!polyCoords || !polyCoords[0] || polyCoords[0].length < 3) return;
        var path = polyCoords[0].map(c => new kakao.maps.LatLng(c[1], c[0]));
        groups[color].paths.push(path);
      });
      groups[color].features.push(f);
      drawn++;
    }

    Object.keys(groups).forEach(function(color) {
      var group = groups[color];
      if (group.paths.length === 0) return;

      var polygon = new kakao.maps.Polygon({
        map: map,
        path: group.paths,
        strokeWeight: 1,
        strokeColor: '#4b1575',
        strokeOpacity: 0.8,
        fillColor: color,
        fillOpacity: 0.55
      });
      currentPolygons.push(polygon);

      kakao.maps.event.addListener(polygon, 'click', function(mouseEvent) {
        suppressNextMapClick = true;
        var lat = mouseEvent.latLng.getLat();
        var lng = mouseEvent.latLng.getLng();
        var matched = null;
        for (var k = 0; k < group.features.length; k++) {
          if (featureContainsPoint(group.features[k], lng, lat)) {
            matched = group.features[k];
            break;
          }
        }
        if (!matched) matched = group.features[0];
        infowindow.setPosition(mouseEvent.latLng);
        infowindow.open(map);
        requestElevation(matched.properties, lat, lng);
      });
    });
  }

  kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
    if (roadviewModeActive) {

  var myLocationMarker = null;

  function locateMe() {

    var btn = document.getElementById('locateBtn');
    btn.textContent = '⏳';

    navigator.geolocation.getCurrentPosition(
      function(pos) {

        var here = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
        map.setCenter(here);
        map.setLevel(4);

        if (myLocationMarker) myLocationMarker.setMap(null);
        myLocationMarker = new kakao.maps.Marker({
          map: map,
          position: here,
          image: new kakao.maps.MarkerImage(
            'data:image/svg+xml;utf-8,' + encodeURIComponent(
              '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"><circle cx="12" cy="12" r="8" fill="#4285F4" stroke="white" stroke-width="3"/></svg>'
            ),
            new kakao.maps.Size(24, 24)
          )
        });
        loadWeatherBadge(pos.coords.latitude, pos.coords.longitude);
      },
      function(err) {
        btn.textContent = '📍';
        alert('위치를 가져올 수 없습니다. 브라우저의 위치 권한을 허용해주세요.');
      },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  }
  document.getElementById('locateBtn').addEventListener('click', locateMe);

  var roadviewClient = new kakao.maps.RoadviewClient();
  var roadview = null;
  var roadviewModeActive = false;
  var roadviewMinimap = null;
  var roadviewMinimapMarker = null;

  function toggleRoadviewMode() {
    var btn = document.getElementById('roadviewBtn');
    roadviewModeActive = !roadviewModeActive;
    btn.classList.toggle('active', roadviewModeActive);
    if (roadviewModeActive) {
      map.addOverlayMapTypeId(kakao.maps.MapTypeId.ROADVIEW);
    } else {
      map.removeOverlayMapTypeId(kakao.maps.MapTypeId.ROADVIEW);
    }
  }
  document.getElementById('roadviewBtn').addEventListener('click', toggleRoadviewMode);

  function openRoadviewAt(latlng) {
    roadviewClient.getNearestPanoId(latlng, 50, function(panoId) {
      if (!panoId) {
        alert('이 위치 근처에는 로드뷰가 없습니다.');
        return;
      }
      document.getElementById('roadviewPanel').classList.add('active');

      var firstTime = !roadview;
      if (firstTime) {
        roadview = new kakao.maps.Roadview(document.getElementById('roadviewContainer'));
        roadviewMinimap = new kakao.maps.Map(document.getElementById('roadviewMinimap'), {
          center: latlng,
          level: 3
        });
        roadviewMinimapMarker = new kakao.maps.Marker({ map: roadviewMinimap, position: latlng });

        kakao.maps.event.addListener(roadview, 'position_changed', function() {
          var pos = roadview.getPosition();
          roadviewMinimap.setCenter(pos);
          roadviewMinimapMarker.setPosition(pos);
        });
        kakao.maps.event.addListener(roadview, 'viewpoint_changed', function() {
          var vp = roadview.getViewpoint();
          var arrow = document.getElementById('roadviewHeadingArrow');
          arrow.style.transform = 'translate(-50%,-50%) rotate(' + vp.pan + 'deg)';
        });
      }
      roadview.setPanoId(panoId, latlng);

      setTimeout(function() {
        roadview.relayout();
        roadviewMinimap.relayout();
        roadviewMinimap.setCenter(latlng);
      }, 0);
    });
  }

  document.getElementById('roadviewCloseBtn').addEventListener('click', function() {
    document.getElementById('roadviewPanel').classList.remove('active');
  });

  var isSatelliteView = true;
  function toggleSatellite() {
    var btn = document.getElementById('satelliteBtn');
    isSatelliteView = !isSatelliteView;
    if (isSatelliteView) {
      map.setMapTypeId(kakao.maps.MapTypeId.HYBRID);
      btn.classList.add('active');
    } else {
      map.setMapTypeId(kakao.maps.MapTypeId.ROADMAP);
      btn.classList.remove('active');
    }
  }
  document.getElementById('satelliteBtn').addEventListener('click', toggleSatellite);
  map.setMapTypeId(kakao.maps.MapTypeId.HYBRID);
  document.getElementById('satelliteBtn').classList.add('active');

  function togglePolygonLayer() {
    var btn = document.getElementById('toggleLayerBtn');
    showPolygons = !showPolygons;
    btn.classList.toggle('off', !showPolygons);
    renderVisiblePolygons();
  }
  document.getElementById('toggleLayerBtn').addEventListener('click', togglePolygonLayer);

  function transformFeatures(features) {
    var out = [];
    var skipped = 0;
    features.forEach(function(feature) {
      try {
        if (!feature.geometry || !feature.geometry.coordinates ||
            feature.geometry.coordinates.length === 0) {
          skipped++; return;
        }
        var coordsList = feature.geometry.type === 'Polygon'
          ? [feature.geometry.coordinates]
          : feature.geometry.coordinates;

        var valid = coordsList.every(function(polyCoords) {
          return polyCoords && polyCoords[0] && polyCoords[0].length >= 4;
        });
        if (!valid) { skipped++; return; }

        out.push({
          coordsList: coordsList,
          bbox: getBbox(coordsList),
          properties: feature.properties
        });
      } catch (e) {
        skipped++;
      }
    });
    if (skipped > 0) console.log('스킵된(깨진) 폴리곤:', skipped);
    return out;
  }

  var tileManifest = null;
  var loadedTileIds = {};
  var pendingTileIds = {};

  function getTileIdsForBounds(bounds, tileSize) {
    var sw = bounds.getSouthWest(), ne = bounds.getNorthEast();
    var txMin = Math.floor(sw.getLng() / tileSize);
    var txMax = Math.floor(ne.getLng() / tileSize);
    var tyMin = Math.floor(sw.getLat() / tileSize);
    var tyMax = Math.floor(ne.getLat() / tileSize);
    var ids = [];
    for (var tx = txMin; tx <= txMax; tx++) {
      for (var ty = tyMin; ty <= tyMax; ty++) {
        ids.push(tx + '_' + ty);
      }
    }
    return ids;
  }

  function fetchTile(tileId) {
    pendingTileIds[tileId] = true;
    return fetch('tiles/tile_' + tileId + '.geojson.gz')
      .then(function(res) {
        if (!res.ok) throw new Error('타일 없음: ' + tileId);
        return res.arrayBuffer();
      })
      .then(function(buffer) {
        var ds = new DecompressionStream('gzip');
        var stream = new Blob([buffer]).stream().pipeThrough(ds);
        return new Response(stream).json();
      })
      .then(function(geojson) {
        var transformed = transformFeatures(geojson.features);
        allFeatures = allFeatures.concat(transformed);
        loadedTileIds[tileId] = true;
      })
      .catch(function(err) {
        loadedTileIds[tileId] = true;
      })
      .finally(function() {
        delete pendingTileIds[tileId];
      });
  }

  function onMapIdle() {
    if (!tileManifest) return;

    if (map.getLevel() > ZOOM_LEVEL_THRESHOLD) {
      renderVisiblePolygons();
      return;
    }

    var bounds = map.getBounds();
    var neededIds = getTileIdsForBounds(bounds, tileManifest.tileSize);
    var toFetch = neededIds.filter(function(id) {
      return tileManifest.tiles[id] && !loadedTileIds[id] && !pendingTileIds[id];
    });

    renderVisiblePolygons();

    if (toFetch.length > 0) {
      Promise.all(toFetch.map(fetchTile)).then(function() {
        renderVisiblePolygons();
      });
    }
  }

  function loadForestData() {
    fetch('tiles/manifest.json')
      .then(function(res) {
        if (!res.ok) throw new Error('manifest.json 없음');
        return res.json();
      })
      .then(function(manifest) {
        tileManifest = manifest;
        kakao.maps.event.addListener(map, 'idle', onMapIdle);
        onMapIdle();
      })
      .catch(function(err) {
        console.log('tiles/manifest.json을 아직 못 찾았습니다. (정상 — 파일 넣기 전까지는 지도+검색만 동작합니다)', err);
      });
  }

  loadForestData();

  // ===== 내 장소 저장(채집기록) 기능 =====
  var savedPlaces = [];
  var savedPlaceMarkers = [];

  var STAR_MARKER_SVG =
    '<svg xmlns="http://www.w3.org/2000/svg" width="30" height="32" viewBox="0 0 30 32">' +
    '<defs><radialGradient id="starGrad" cx="35%" cy="30%" r="75%">' +
    '<stop offset="0%" stop-color="#ff8a75"/><stop offset="60%" stop-color="#e53935"/><stop offset="100%" stop-color="#a31515"/>' +
    '</radialGradient></defs>' +
    '<path d="M15 2 L18.5 11 L28 11.5 L20.5 17.5 L23 27 L15 21.5 L7 27 L9.5 17.5 L2 11.5 L11.5 11 Z" fill="url(#starGrad)" stroke="#7a1a1a" stroke-width="1" stroke-linejoin="round"/>' +
    '</svg>';

  var CIRCLE_MARKER_SVG =
    '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 26 26">' +
    '<defs><radialGradient id="circGrad" cx="35%" cy="30%" r="75%">' +
    '<stop offset="0%" stop-color="#fff59d"/><stop offset="60%" stop-color="#fbc02d"/><stop offset="100%" stop-color="#e65100"/>' +
    '</radialGradient></defs>' +
    '<circle cx="13" cy="13" r="10" fill="url(#circGrad)" stroke="#a15c00" stroke-width="1.5"/>' +
    '</svg>';

  function buildSavedPlaceMarkerImage(iconType) {
    if (iconType === 'circle') {
      return new kakao.maps.MarkerImage(
        'data:image/svg+xml;utf-8,' + encodeURIComponent(CIRCLE_MARKER_SVG),
        new kakao.maps.Size(26, 26),
        { offset: new kakao.maps.Point(13, 13) }
      );
    }
    return new kakao.maps.MarkerImage(
      'data:image/svg+xml;utf-8,' + encodeURIComponent(STAR_MARKER_SVG),
      new kakao.maps.Size(30, 32),
      { offset: new kakao.maps.Point(15, 16) }
    );
  }

  function todayISO() {
    var d = new Date();
    var mm = String(d.getMonth() + 1).padStart(2, '0');
    var dd = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + mm + '-' + dd;
  }

  function loadSavedPlaces() {
    try {
      var raw = localStorage.getItem('savedPlaces');
      savedPlaces = raw ? JSON.parse(raw) : [];
    } catch (e) { savedPlaces = []; }
    renderSavedPlaces();
  }

  function persistSavedPlaces() {
    try { localStorage.setItem('savedPlaces', JSON.stringify(savedPlaces)); } catch (e) {}
  }

  function renderSavedPlaces() {
    savedPlaceMarkers.forEach(function(m) { m.setMap(null); });
    savedPlaceMarkers = [];
    savedPlaces.forEach(function(place, idx) {
      var marker = new kakao.maps.Marker({
        map: map,
        position: new kakao.maps.LatLng(place.lat, place.lng),
        image: buildSavedPlaceMarkerImage(place.icon)
      });
      kakao.maps.event.addListener(marker, 'click', function() {
        suppressNextMapClick = true;
        showSavedPlaceInfo(marker, place, idx, '조회 중...');
        getShortAddress(place.lat, place.lng, function(addr) {
          showSavedPlaceInfo(marker, place, idx, addr || '정보 없음');
        });
      });
      savedPlaceMarkers.push(marker);
    });
  }

  function showSavedPlaceInfo(marker, place, idx, addrText) {
    var dateLine = place.date ? ('<br><span style="color:#888;font-size:11px;">방문일: ' + escapeHtml(place.date) + '</span>') : '';
    var memoLine = place.memo ? ('<br><span style="font-size:12px;">' + escapeHtml(place.memo) + '</span>') : '';
    infowindow.setContent(
      '<div style="background:rgba(255,255,255,0.88);padding:8px 10px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.25);font-size:12px;width:180px;box-sizing:border-box;white-space:normal;word-break:break-all;">' +
      escapeHtml(place.name) + dateLine +
      '<br>주소: ' + escapeHtml(addrText) + memoLine +
      '<br><a href="#" id="editSavedPlaceLink" style="color:#4b1575;text-decoration:underline;">편집</a>' +
      ' · <a href="#" id="deleteSavedPlaceLink" style="color:#c0392b;text-decoration:underline;">삭제</a></div>'
    );
    infowindow.setPosition(marker.getPosition());
    infowindow.open(map);
    setTimeout(function() {
      var editLink = document.getElementById('editSavedPlaceLink');
      if (editLink) {
        editLink.addEventListener('click', function(e) {
          e.preventDefault();
          openPlaceModalEdit(idx);
        });
      }
      var delLink = document.getElementById('deleteSavedPlaceLink');
      if (delLink) {
        delLink.addEventListener('click', function(e) {
          e.preventDefault();
          savedPlaces.splice(idx, 1);
          persistSavedPlaces();
          renderSavedPlaces();
          infowindow.close();
        });
      }
    }, 0);
  }

  // ===== 저장/편집 모달 =====
  var placeModalMode = 'create';
  var placeModalTargetIdx = null;
  var placeModalLat = null;
  var placeModalLng = null;
  var placeModalSelectedIcon = 'star';

  function setPlaceModalIcon(icon) {
    placeModalSelectedIcon = icon;
    document.querySelectorAll('.placeIconChoice').forEach(function(btn) {
      btn.classList.toggle('selected', btn.getAttribute('data-icon') === icon);
    });
  }

  document.querySelectorAll('.placeIconChoice').forEach(function(btn) {
    btn.addEventListener('click', function() {
      setPlaceModalIcon(btn.getAttribute('data-icon'));
    });
  });

  function openPlaceModalCreate(lat, lng) {
    placeModalMode = 'create';
    placeModalTargetIdx = null;
    placeModalLat = lat;
    placeModalLng = lng;
    document.getElementById('placeModalTitle').textContent = '장소 저장';
    document.getElementById('placeModalName').value = '';
    document.getElementById('placeModalMemo').value = '';
    document.getElementById('placeModalDate').value = todayISO();
    setPlaceModalIcon('star');
    document.getElementById('placeModalDeleteBtn').style.display = 'none';
    document.getElementById('placeModalOverlay').classList.add('show');
  }

  function openPlaceModalEdit(idx) {
    var p = savedPlaces[idx];
    if (!p) return;
    placeModalMode = 'edit';
    placeModalTargetIdx = idx;
    placeModalLat = p.lat;
    placeModalLng = p.lng;
    document.getElementById('placeModalTitle').textContent = '장소 수정';
    document.getElementById('placeModalName').value = p.name;
    document.getElementById('placeModalMemo').value = p.memo || '';
    document.getElementById('placeModalDate').value = p.date || todayISO();
    setPlaceModalIcon(p.icon || 'star');
    document.getElementById('placeModalDeleteBtn').style.display = 'block';
    infowindow.close();
    document.getElementById('placeModalOverlay').classList.add('show');
  }

  function closePlaceModal() {
    document.getElementById('placeModalOverlay').classList.remove('show');
  }

  document.getElementById('placeModalCloseBtn').addEventListener('click', closePlaceModal);
  document.getElementById('placeModalOverlay').addEventListener('click', function(e) {
    if (e.target.id === 'placeModalOverlay') closePlaceModal();
  });

  document.getElementById('placeModalSaveBtn').addEventListener('click', function() {
    var name = document.getElementById('placeModalName').value.trim();
    if (!name) { alert('이름을 입력해주세요.'); return; }
    var date = document.getElementById('placeModalDate').value || todayISO();
    var memo = document.getElementById('placeModalMemo').value;
    var entry = {
      lat: placeModalLat, lng: placeModalLng, name: name,
      icon: placeModalSelectedIcon, date: date, memo: memo
    };
    if (placeModalMode === 'create') {
      savedPlaces.push(entry);
    } else {
      savedPlaces[placeModalTargetIdx] = entry;
    }
    persistSavedPlaces();
    renderSavedPlaces();
    closePlaceModal();
  });

  document.getElementById('placeModalDeleteBtn').addEventListener('click', function() {
    if (placeModalTargetIdx !== null) {
      savedPlaces.splice(placeModalTargetIdx, 1);
      persistSavedPlaces();
      renderSavedPlaces();
    }
    closePlaceModal();
  });
  // ===== 내 장소 저장 기능 끝 =====

  function getLatLngFromClientXY(clientX, clientY) {
    var rect = mapContainer.getBoundingClientRect();
    var x = clientX - rect.left;
    var y = clientY - rect.top;
    var proj = map.getProjection();
    return proj.coordsFromContainerPoint(new kakao.maps.Point(x, y));
  }

  var longPressTimer = null;
  var longPressStartPoint = null;
  var LONG_PRESS_MS = 1250;
  var LONG_PRESS_MOVE_TOLERANCE = 8;

  function handlePressStart(clientX, clientY) {
    longPressStartPoint = { x: clientX, y: clientY };
    longPressTimer = setTimeout(function() {
      longPressStartPoint = null;
      var latlng = getLatLngFromClientXY(clientX, clientY);
      openPlaceModalCreate(latlng.getLat(), latlng.getLng());
    }, LONG_PRESS_MS);
  }
  function handlePressMove(clientX, clientY) {
    if (!longPressStartPoint) return;
    var dx = clientX - longPressStartPoint.x;
    var dy = clientY - longPressStartPoint.y;
    if (Math.sqrt(dx * dx + dy * dy) > LONG_PRESS_MOVE_TOLERANCE) {
      clearTimeout(longPressTimer);
      longPressStartPoint = null;
    }
  }
  function handlePressEnd() {
    clearTimeout(longPressTimer);
    longPressStartPoint = null;
  }

  mapContainer.addEventListener('touchstart', function(e) {
    if (e.touches.length > 1) {
      handlePressEnd();
      return;
    }
    handlePressStart(e.touches[0].clientX, e.touches[0].clientY);
  });
  mapContainer.addEventListener('touchmove', function(e) {
    if (e.touches.length !== 1) return;
    handlePressMove(e.touches[0].clientX, e.touches[0].clientY);
  });
  mapContainer.addEventListener('touchend', handlePressEnd);
  mapContainer.addEventListener('touchcancel', handlePressEnd);

  mapContainer.addEventListener('mousedown', function(e) {
    handlePressStart(e.clientX, e.clientY);
  });
  mapContainer.addEventListener('mousemove', function(e) {
    handlePressMove(e.clientX, e.clientY);
  });
  mapContainer.addEventListener('mouseup', handlePressEnd);
  mapContainer.addEventListener('mouseleave', handlePressEnd);

  loadSavedPlaces();

  if (!savedView && navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      function(pos) {
        var here = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
        map.setCenter(here);
        map.setLevel(4);

        if (myLocationMarker) myLocationMarker.setMap(null);
        myLocationMarker = new kakao.maps.Marker({
          map: map,
          position: here,
          image: new kakao.maps.MarkerImage(
            'data:image/svg+xml;utf-8,' + encodeURIComponent(
              '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"><circle cx="12" cy="12" r="8" fill="#4285F4" stroke="white" stroke-width="3"/></svg>'
            ),
            new kakao.maps.Size(24, 24)
          )
        });
        loadWeatherBadge(pos.coords.latitude, pos.coords.longitude);
        hideSplash();
      },
      function(err) {
        hideSplash();
      },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  } else if (!savedView) {
    hideSplash();
  }
</script>
